name: build docker image

# Builds the sma-finder docker image and pushes it to Docker Hub whenever docker-relevant files
# change on main (reuses docker/Makefile's `all` target: build, push, update_sha), then commits the
# updated sha256 digest -- which `make update_sha` bakes into sma_finder_wdl_pipeline.wdl and
# sma_finder_hail_batch_pipeline.py -- back to the repo.
#
# Can also be triggered manually from the Actions tab.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token with read/write/delete scope

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - 'docker/Makefile'
      - 'sma_finder.py'
      - 'plot_SMN1_SMN2_scatter.py'
      - 'check_for_new_cases.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, push, and update sha256 digest
        working-directory: docker
        run: make all

      - name: Commit updated sha256 digest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker/sha256.txt sma_finder_wdl_pipeline.wdl sma_finder_hail_batch_pipeline.py
          if git diff --cached --quiet; then
            echo "No sha256 changes to commit"
            exit 0
          fi
          git commit -m "Update docker image sha256 digest [skip ci]"
          # A concurrent commit may land on main during the build; on a non-fast-forward push, rebase
          # onto the latest main -- taking our freshly-built digest on conflict (-X theirs) -- and retry.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push attempt ${attempt} failed; rebasing onto latest main and retrying."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Failed to push sha256 digest after multiple attempts."
          exit 1
